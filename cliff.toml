# git-cliff configuration shared by every deployable (ADR-SHARED-0014).
#
# Do not run `git cliff` directly: use scripts/changelog.sh, which adds the
# per-deployable --include-path and --tag-pattern. Without them every commit in
# the monorepo would land in one changelog.
#
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this deployable are documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by `scripts/changelog.sh` from Conventional Commits. Do not edit it by hand.
"""

# Tags are scoped per deployable (`bff/v1.2.0`). The heading shows only the
# SemVer part, because the file already lives inside the deployable.
body = """
{% if version -%}
## [{{ version | split(pat="/v") | last }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} ({{ commit.breaking_description }}){% endif %} \
({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""

# The template controls blank lines itself; trimming would glue releases together.
trim = false

[git]
conventional_commits = true
# Non-conventional commits are dropped instead of failing; commitlint in CI is
# what keeps the history conventional.
filter_unconventional = true
require_conventional = false
split_commits = false
# A breaking commit is never skipped, even if its type is normally hidden.
protect_breaking_commits = true
sort_commits = "oldest"
topo_order = false

# First match wins. The HTML comments only control the order of the sections
# (Keep a Changelog order) and are removed by `striptags` in the template.
#
# A `Changelog:` trailer overrides the commit type, matching GitLab's own
# convention, for the sections Conventional Commits has no type for:
#   Changelog: security | deprecated | removed | ignore
commit_parsers = [
  { footer = "(?i)^changelog: ?ignore", skip = true },
  { footer = "(?i)^changelog: ?security", group = "<!-- 5 -->Security" },
  { footer = "(?i)^changelog: ?deprecated", group = "<!-- 2 -->Deprecated" },
  { footer = "(?i)^changelog: ?removed", group = "<!-- 3 -->Removed" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 1 -->Changed" },
  # Not user-visible: build, ci, chore, docs, style, test.
  { message = "^(build|ci|chore|docs|style|test)", skip = true },
]

[bump]
# Before 1.0.0 a breaking change bumps the minor version, not the major.
breaking_always_bump_major = false
features_always_bump_minor = true
initial_tag = "0.1.0"
